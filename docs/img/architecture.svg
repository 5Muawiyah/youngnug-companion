<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title">
  <title id="title">The Companion's parts: the popup and options pages and the service worker in the browser, the page scripts injected into the active tab on the student's click, the review screen and the one writer, and the backend outside the browser</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C8DFF"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .t { font-size: 15px; font-weight: 600; fill: #1F2933; }
      .s { font-size: 12px; fill: #52606D; }
      .l { font-size: 12px; fill: #4C8DFF; }
      .f { font-size: 12.5px; fill: #1F2933; }
      .box { fill: #FFFFFF; stroke: #4C8DFF; stroke-width: 2; }
      .n { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>
  <rect width="960" height="500" fill="#FFFFFF"/>

  <!-- the browser -->
  <rect x="20" y="20" width="680" height="400" rx="12" fill="none" stroke="#4C8DFF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="l" x="36" y="42">the student's own Chrome</text>

  <rect class="box" x="50" y="62" width="220" height="92" rx="8"/>
  <text class="t" x="160" y="90" text-anchor="middle">popup and options</text>
  <text class="s" x="160" y="112" text-anchor="middle">the extension's own pages</text>
  <text class="s" x="160" y="130" text-anchor="middle">save, fill, undo, stop</text>

  <rect class="box" x="420" y="62" width="250" height="92" rx="8"/>
  <text class="t" x="545" y="90" text-anchor="middle">service worker</text>
  <text class="s" x="545" y="112" text-anchor="middle">holds the account token</text>
  <text class="s" x="545" y="130" text-anchor="middle">the only part that calls the API</text>

  <line x1="272" y1="108" x2="418" y2="108" stroke="#4C8DFF" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="l" x="345" y="99" text-anchor="middle">messages</text>

  <!-- the active tab -->
  <rect x="40" y="206" width="640" height="196" rx="10" fill="#EEF4FF" stroke="#4C8DFF" stroke-width="1.5"/>
  <text class="l" x="56" y="392">the active tab: an advert or an application form</text>

  <rect class="box" x="60" y="252" width="180" height="120" rx="8"/>
  <text class="t" x="150" y="280" text-anchor="middle">page scripts</text>
  <text class="s" x="150" y="302" text-anchor="middle">injected on the click</text>
  <text class="s" x="150" y="320" text-anchor="middle">detection, adapters</text>
  <text class="s" x="150" y="338" text-anchor="middle">and heuristics</text>

  <rect class="box" x="270" y="252" width="180" height="120" rx="8"/>
  <text class="t" x="360" y="280" text-anchor="middle">review screen</text>
  <text class="s" x="360" y="302" text-anchor="middle">every guessed field</text>
  <text class="s" x="360" y="320" text-anchor="middle">and every draft</text>
  <text class="s" x="360" y="338" text-anchor="middle">approve or cancel</text>

  <rect class="box" x="480" y="252" width="180" height="120" rx="8"/>
  <text class="t" x="570" y="280" text-anchor="middle">one writer</text>
  <text class="s" x="570" y="302" text-anchor="middle">every write passes</text>
  <text class="s" x="570" y="320" text-anchor="middle">the guards: no submit,</text>
  <text class="s" x="570" y="338" text-anchor="middle">password or payment</text>

  <line x1="242" y1="312" x2="268" y2="312" stroke="#4C8DFF" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="452" y1="312" x2="478" y2="312" stroke="#4C8DFF" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- click 1: the popup injects the page scripts -->
  <line x1="130" y1="156" x2="130" y2="250" stroke="#4C8DFF" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="108" cy="182" r="11" fill="#4C8DFF"/>
  <text class="n" x="108" y="186" text-anchor="middle">1</text>

  <!-- click 2: approve releases the write -->
  <circle cx="465" cy="288" r="11" fill="#4C8DFF"/>
  <text class="n" x="465" y="292" text-anchor="middle">2</text>

  <!-- page scripts ask the worker -->
  <line x1="236" y1="250" x2="470" y2="156" stroke="#4C8DFF" stroke-width="1.5" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="s" x="366" y="192" text-anchor="end">profile, fill plan, results</text>

  <!-- backend, outside the browser -->
  <rect class="box" x="730" y="62" width="210" height="92" rx="8"/>
  <text class="t" x="835" y="90" text-anchor="middle">backend</text>
  <text class="s" x="835" y="112" text-anchor="middle">a YoungNug server</text>
  <text class="s" x="835" y="130" text-anchor="middle">local by default</text>

  <line x1="672" y1="108" x2="728" y2="108" stroke="#4C8DFF" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="l" x="835" y="178" text-anchor="middle">HTTPS with a scoped token,</text>
  <text class="l" x="835" y="195" text-anchor="middle">the student's own account only</text>

  <!-- key -->
  <text class="f" x="40" y="452">1 · Nothing runs on a job site until the student clicks the Companion on that tab.</text>
  <text class="f" x="40" y="474">2 · Nothing is written until the student presses Approve. The extension never submits the form.</text>
</svg>
