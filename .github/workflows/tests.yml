name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install esbuild and jsdom
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest and Playwright
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for the layout fixtures
        run: python -m playwright install --with-deps chromium

      - name: Syntax-check every extension script and test runner
        run: npm run check

      - name: Browser-free Node suites
        run: npm run test:node

      - name: Python suite (includes the build-drift check)
        run: python -m pytest -q
