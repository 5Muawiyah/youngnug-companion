<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Apply — Lever-style Co</title>
  </head>
  <body>
    <h1>Apply to Lever-style Co</h1>
    <!-- Lever's real demographic-monitoring questions are exactly this
         shape: one native radio per option, each wrapped in its OWN
         <label> (so the browser's implicit label association gives that
         radio a perfectly usable, quality-passing label — "Other ethnic
         background", "No known disability" — that is nonetheless the wrong
         text for a report row about the GROUP's question). -->
    <form id="app-form" action="#" onsubmit="return false;">
      <p>
        <label for="first_name">First name</label>
        <input type="text" id="first_name" name="first_name" autocomplete="given-name" />
      </p>
      <p>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" />
      </p>

      <fieldset id="ethnicity-group">
        <legend>What is your ethnic group?</legend>
        <label><input type="radio" name="ethnicity" id="eth-white" /> White</label>
        <label><input type="radio" name="ethnicity" id="eth-asian" /> Asian or Asian British</label>
        <label><input type="radio" name="ethnicity" id="eth-other" /> Other ethnic background</label>
      </fieldset>

      <fieldset id="disability-group">
        <legend>Do you consider yourself to have a disability?</legend>
        <label><input type="radio" name="disability" id="dis-yes" /> Yes</label>
        <label><input type="radio" name="disability" id="dis-no" /> No</label>
        <label><input type="radio" name="disability" id="dis-none" /> No known disability</label>
      </fieldset>

      <p>
        <button type="submit" id="submit-btn">Submit application</button>
      </p>
    </form>
  </body>
</html>
