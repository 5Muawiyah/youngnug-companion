<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Information — post-login application step</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 24px auto;
        padding: 0 16px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 4px;
      }
      input[type="text"],
      input[type="email"] {
        width: 100%;
        max-width: 360px;
        padding: 6px 8px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <!--
      Positive control for the password=wall rule:
        Post-login application step (My Information) with NO password field.
        ynIsAccountCreationWall must be false; name/email must still FILL.
    -->
    <h1>My Information</h1>
    <p>Please confirm your contact details for this application.</p>
    <form id="my-info-form" action="#" onsubmit="return false;">
      <p>
        <label for="first_name">First name</label>
        <input
          type="text"
          id="first_name"
          name="first_name"
          autocomplete="given-name"
          value=""
        />
      </p>
      <p>
        <label for="last_name">Last name</label>
        <input
          type="text"
          id="last_name"
          name="last_name"
          autocomplete="family-name"
          value=""
        />
      </p>
      <p>
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          value=""
        />
      </p>
      <p>
        <button type="submit" id="submit-btn">Save and continue</button>
      </p>
    </form>
    <script>
      window.__submitted = false;
      var form = document.getElementById("my-info-form");
      var btn = document.getElementById("submit-btn");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        window.__submitted = true;
      });
      btn.addEventListener("click", function () {
        window.__submitted = true;
      });
    </script>
  </body>
</html>
