<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Create Account — single generic password wall</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 24px auto;
        padding: 0 16px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 4px;
      }
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        max-width: 360px;
        padding: 6px 8px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <!--
      Judge evasion for shared ynIsAccountCreationWall:
        - Create Account page text
        - EXACTLY ONE generically-named password (name="password")
        - NO verify/confirm/new-password signal
        - NO "Create Account" button text (would trip the old button check)
        - email field that heuristics would otherwise fill
      Shared wall must be true; email stays EMPTY; 0 fill intents.
    -->
    <h1>Create Account</h1>
    <p>Enter your details to continue.</p>
    <form id="create-account-form" action="#" onsubmit="return false;">
      <p>
        <label for="input-email">Email Address</label>
        <input
          type="email"
          id="input-email"
          name="email"
          autocomplete="email"
          value=""
        />
      </p>
      <p>
        <label for="input-password">Password</label>
        <input
          type="password"
          id="input-password"
          name="password"
          value=""
        />
      </p>
      <p>
        <button type="submit" id="continue-btn">Continue</button>
      </p>
    </form>
    <script>
      window.__submitted = false;
      var form = document.getElementById("create-account-form");
      var btn = document.getElementById("continue-btn");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        window.__submitted = true;
      });
      btn.addEventListener("click", function () {
        window.__submitted = true;
      });
    </script>
  </body>
</html>
