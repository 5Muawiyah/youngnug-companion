    <script>
      // Tripwires for the never-submit / never-advance proofs. A real site
      // would navigate; the fixture only records that a click happened.
      window.__submitted = false;
      window.__advanced = false;
      window.__saved = false;
      document.addEventListener("submit", function (e) { e.preventDefault(); window.__submitted = true; }, true);
      document.addEventListener("click", function (e) {
        var b = e.target && e.target.closest ? e.target.closest("button") : null;
        if (!b) return;
        var t = (b.textContent || "").replace(/\s+/g, " ").trim() + " " + (b.getAttribute("aria-label") || "");
        if (/submit/i.test(t)) window.__submitted = true;
        else if (/^(next|continue) |continue to next step|review your application/i.test(t + " ")) window.__advanced = true;
        else if (/^save\b/i.test(t)) window.__saved = true;
      }, true);
    </script>
