<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Greenhouse SSR form with R10-cross-checked education ids</title></head>
<body>
<form id="application-form" action="https://boards.greenhouse.io/acme/jobs/1/submit">
  <input id="first_name" name="job_application[first_name]" />
  <input id="last_name" name="job_application[last_name]" />
  <input id="email" name="job_application[email]" />
  <input id="phone" name="job_application[phone]" />
  <input id="school" name="job_application[answers_attributes][0][text_value]" />
  <input id="degree" name="job_application[answers_attributes][1][text_value]" />
  <input id="discipline" name="job_application[answers_attributes][2][text_value]" />
  <input id="start-month" />
  <input id="start-year" />
  <input id="end-month" />
  <input id="end-year" />
  <input type="file" id="resume" name="job_application[resume]" />
</form>
</body>
</html>
