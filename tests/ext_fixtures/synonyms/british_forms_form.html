<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>British-forms application</title></head>
<body>
  <!-- 20 British-forms labels, a mix of wording the ladder already
       resolved and the synonym alternations added for them. -->
  <form id="app">
    <label for="q1">Forename</label><input id="q1" type="text" />
    <label for="q2">Surname</label><input id="q2" type="text" />
    <label for="q3">Christian name</label><input id="q3" type="text" />
    <label for="q4">Sur name</label><input id="q4" type="text" />
    <label for="q5">Post code</label><input id="q5" type="text" />
    <label for="q6">Mobile</label><input id="q6" type="text" />
    <label for="q7">Landline</label><input id="q7" type="text" />
    <label for="q8">Town/City</label><input id="q8" type="text" />
    <label for="q9">Second line of address</label><input id="q9" type="text" />
    <label for="q10">Flat</label><input id="q10" type="text" />
    <label for="q11">E-mail</label><input id="q11" type="text" />
    <label for="q12">Driving licence</label><input id="q12" type="checkbox" />
    <label for="q13">Driver's licence</label><input id="q13" type="checkbox" />
    <label for="q14">Period of notice</label><input id="q14" type="text" />
    <label for="q15">Notice period</label><input id="q15" type="text" />
    <label for="q16">How much experience do you have?</label><input id="q16" type="text" />
    <label for="q17">Years of experience</label><input id="q17" type="text" />
    <label for="q18">Name of employer</label><input id="q18" type="text" />
    <label for="q19">Role title</label><input id="q19" type="text" />
    <label for="q20">Job title</label><input id="q20" type="text" />

    <!-- Decoys: must NOT gain a new false claim from the synonym additions. -->
    <label for="d1">Company name</label><input id="d1" type="text" />
    <label for="d2">Emergency contact number</label><input id="d2" type="text" />
    <label for="d3">Username</label><input id="d3" type="text" />
  </form>
</body>
</html>
