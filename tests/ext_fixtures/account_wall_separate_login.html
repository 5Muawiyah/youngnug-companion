<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guest apply beside returning-applicant sign-in</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .layout {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
      .panel {
        flex: 1 1 280px;
        border: 1px solid #ccc;
        padding: 16px;
        border-radius: 6px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 4px;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"],
      input[type="password"] {
        width: 100%;
        max-width: 320px;
        padding: 6px 8px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <!--
      Common ATS pattern: SEPARATE guest-apply form (no password) next to a
      "Returning Applicant Sign In" widget (email+password in its OWN form).
      Document-wide password scans wrongly zero the guest form; field-scoped
      wall must fill guest name/email/phone and leave login fields empty.
      No page-level "Create Account" heading/button — page wall must be false.
    -->
    <h1>Application</h1>
    <p>Complete the guest application, or sign in if you already have an account.</p>
    <div class="layout">
      <div class="panel" id="guest-panel">
        <h2>Apply as Guest</h2>
        <form id="guest-apply-form" action="#" onsubmit="return false;">
          <p>
            <label for="guest_first_name">First name</label>
            <input
              type="text"
              id="guest_first_name"
              name="first_name"
              autocomplete="given-name"
              value=""
            />
          </p>
          <p>
            <label for="guest_email">Email</label>
            <input
              type="email"
              id="guest_email"
              name="email"
              autocomplete="email"
              value=""
            />
          </p>
          <p>
            <label for="guest_phone">Phone</label>
            <input
              type="tel"
              id="guest_phone"
              name="phone"
              autocomplete="tel"
              value=""
            />
          </p>
          <p>
            <button type="submit" id="guest-submit">Continue application</button>
          </p>
        </form>
      </div>
      <div class="panel login-widget" id="login-panel">
        <h2>Returning Applicant Sign In</h2>
        <form id="returning-login-form" class="signin-form" action="#" onsubmit="return false;">
          <p>
            <label for="login_email">Email</label>
            <input
              type="email"
              id="login_email"
              name="login_email"
              autocomplete="username"
              value=""
            />
          </p>
          <p>
            <label for="login_password">Password</label>
            <input
              type="password"
              id="login_password"
              name="password"
              autocomplete="current-password"
              value=""
            />
          </p>
          <p>
            <button type="submit" id="login-submit">Sign In</button>
          </p>
        </form>
      </div>
    </div>
    <script>
      window.__submitted = false;
      function markSubmitted(e) {
        if (e) e.preventDefault();
        window.__submitted = true;
      }
      document
        .getElementById("guest-apply-form")
        .addEventListener("submit", markSubmitted);
      document
        .getElementById("returning-login-form")
        .addEventListener("submit", markSubmitted);
      document
        .getElementById("guest-submit")
        .addEventListener("click", markSubmitted);
      document
        .getElementById("login-submit")
        .addEventListener("click", markSubmitted);
    </script>
  </body>
</html>
