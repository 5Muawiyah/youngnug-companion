<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Work history</title></head>
<body>
  <!-- two experience rows ALREADY rendered on the
       page (no Add-button clicking needed here — that is repeater.js's job) so
       row-aware grouping can be proven without repeater.js existing yet. -->
  <form id="app">
    <div class="experience-row" data-row="0">
      <label for="emp0">Employer</label>
      <input id="emp0" type="text" />
      <label for="title0">Job title</label>
      <input id="title0" type="text" />
    </div>
    <div class="experience-row" data-row="1">
      <label for="emp1">Employer</label>
      <input id="emp1" type="text" />
      <label for="title1">Job title</label>
      <input id="title1" type="text" />
    </div>
  </form>
</body>
</html>
