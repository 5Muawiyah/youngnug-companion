<!doctype html>
<html>
  <head>
    <title>
      Factual questions fixture — recognised questions with no stored answer
    </title>
  </head>
  <body>
    <h1>Eligibility</h1>
    <label for="q_email">E-mail</label>
    <input id="q_email" type="text" />

    <!-- recognised factual questions, NONE stored in this fixture's profile -->
    <fieldset>
      <legend>Do you have the right to work in the UK?</legend>
      <label
        ><input type="radio" name="rtw" id="q_rtw_yes" value="y" /> Yes</label
      >
      <label
        ><input type="radio" name="rtw" id="q_rtw_no" value="n" /> No</label
      >
    </fieldset>

    <label for="q_notice">Notice period</label>
    <input id="q_notice" type="text" />

    <label for="q_salary">Salary expectation</label>
    <input id="q_salary" type="text" />

    <!-- free-text question — the backend composer answers it (always amber) -->
    <label for="q_why">Why do you want to join us?</label>
    <textarea id="q_why"></textarea>
  </body>
</html>
