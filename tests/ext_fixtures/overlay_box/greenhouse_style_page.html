<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Greenhouse-style apply page (representative fixture)</title>
<style>
  html, body { margin:0; font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background:#fff; color:#222; }
  .app-title { padding:24px 40px 0; font-size:22px; font-weight:600; }
  .app-form { max-width:640px; margin:0 auto; padding:24px 40px 80px; }
  .field { margin-bottom:18px; }
  .field label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
  .field input, .field select { width:100%; padding:9px 10px; border:1px solid #c7c7c7; border-radius:3px; box-sizing:border-box; font-size:14px; }
  .submit-row { position:sticky; bottom:0; background:#fff; padding:16px 40px; border-top:1px solid #e5e5e5; text-align:right; }
  .submit-btn { background:#0a66c2; color:#fff; border:0; padding:12px 32px; border-radius:4px; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
  <div class="app-title">Apply for Graduate Software Engineer</div>
  <div class="app-form">
    <div class="field"><label for="first_name">First Name</label><input id="first_name" name="job_application[first_name]"></div>
    <div class="field"><label for="last_name">Last Name</label><input id="last_name" name="job_application[last_name]"></div>
    <div class="field"><label for="email">Email</label><input id="email" name="job_application[email]"></div>
    <div class="field"><label for="phone">Phone</label><input id="phone" name="job_application[phone]"></div>
    <div class="field"><label for="resume">Resume/CV</label><input type="file" id="resume" name="job_application[resume]"></div>
  </div>
  <div class="submit-row"><button class="submit-btn" type="button">Submit Application</button></div>
</body>
</html>
