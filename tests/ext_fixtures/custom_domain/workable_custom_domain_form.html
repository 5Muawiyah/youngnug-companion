<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Careers at Example Ltd</title></head>
<body>
  <!-- A Workable-shaped tenant on ITS OWN custom domain
       (careers.example.com, not apply.workable.com), carrying NEITHER the
       URL signature nor the data-ui="application-form" fingerprint
       content/detect.js keys on: ynDetectAts must honestly answer
       "unknown" here, and no adapter runs. Ordinary label markup — no
       react-aria/MUI/Chakra/Ant/Element CSS fingerprint at all — because
       the measured question is whether the GENERIC heuristics rung alone
       already resolves name/email/phone without one. -->
  <form id="candidate-form">
    <label for="firstname">First name</label>
    <input id="firstname" name="firstname" type="text" />

    <label for="lastname">Last name</label>
    <input id="lastname" name="lastname" type="text" />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" />

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel" />
  </form>
</body>
</html>
