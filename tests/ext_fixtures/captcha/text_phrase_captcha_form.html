<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Volunteer application</title></head>
<body>
  <!-- a bespoke inline anti-bot field with NO iframe and no
       id/class naming it as a captcha — only its own wording gives it away.
       A normal, otherwise-fillable field sits right beside it so the test
       can show the HARD STOP reaches the whole page, not just this field. -->
  <form id="app">
    <label for="first">First name</label>
    <input id="first" name="first_name" type="text" />

    <label for="email">Email address</label>
    <input id="email" name="email" type="email" />

    <label for="human-check">IF you are a human, type ALAN below</label>
    <input id="human-check" name="human_check" type="text" />

    <button type="submit">Submit</button>
  </form>
</body>
</html>
