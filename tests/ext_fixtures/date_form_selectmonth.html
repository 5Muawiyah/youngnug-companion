<!doctype html>
<html>
  <head>
    <title>Date fixture — month select must not be raw-written</title>
  </head>
  <body>
    <h1>Availability</h1>
    <fieldset>
      <legend>Earliest start date</legend>
      <input id="m_day" type="text" aria-label="Day" />
      <select id="m_month" aria-label="Month">
        <option value="">Month</option>
        <option value="1">January</option>
        <option value="9">September</option>
      </select>
      <input id="m_year" type="text" aria-label="Year" />
    </fieldset>
  </body>
</html>
