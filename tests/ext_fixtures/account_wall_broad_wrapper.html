<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Guest apply inside broad account wrapper</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .layout {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
      .panel {
        flex: 1 1 280px;
        border: 1px solid #ccc;
        padding: 16px;
        border-radius: 6px;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 4px;
      }
      input[type="text"],
      input[type="email"],
      input[type="tel"],
      input[type="password"] {
        width: 100%;
        max-width: 320px;
        padding: 6px 8px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <!--
      BUG A (over-block) repro — formless outer ATS wrapper id="account-application"
      encloses BOTH a no-password guest panel AND a separate login widget.
      Field-anchored walls that walked the field UP to the first [id*=account]
      wrongly walled the guest. Password-anchored: login password scopes to
      .login-widget only; guest fields FILL; login fields stay EMPTY.
      No page-level Create Account heading/button.
    -->
    <h1>Application</h1>
    <p>Apply as a guest, or sign in if you already have an account.</p>
    <div id="account-application">
      <div class="layout">
        <div class="panel" id="guest-panel">
          <h2>Apply as Guest</h2>
          <p>
            <label for="guest_first_name">First name</label>
            <input
              type="text"
              id="guest_first_name"
              name="first_name"
              autocomplete="given-name"
              value=""
            />
          </p>
          <p>
            <label for="guest_email">Email</label>
            <input
              type="email"
              id="guest_email"
              name="email"
              autocomplete="email"
              value=""
            />
          </p>
          <p>
            <label for="guest_phone">Phone</label>
            <input
              type="tel"
              id="guest_phone"
              name="phone"
              autocomplete="tel"
              value=""
            />
          </p>
          <p>
            <button type="button" id="guest-submit">Continue application</button>
          </p>
        </div>
        <div class="panel login-widget" id="login-panel">
          <h2>Returning Applicant Sign In</h2>
          <p>
            <label for="login_email">Email</label>
            <input
              type="email"
              id="login_email"
              name="login_email"
              autocomplete="username"
              value=""
            />
          </p>
          <p>
            <label for="login_password">Password</label>
            <input
              type="password"
              id="login_password"
              name="password"
              autocomplete="current-password"
              value=""
            />
          </p>
          <p>
            <button type="button" id="login-submit">Sign In</button>
          </p>
        </div>
      </div>
    </div>
    <script>
      window.__submitted = false;
      function markSubmitted() {
        window.__submitted = true;
      }
      document
        .getElementById("guest-submit")
        .addEventListener("click", markSubmitted);
      document
        .getElementById("login-submit")
        .addEventListener("click", markSubmitted);
    </script>
  </body>
</html>
